name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WorkTimeRecorder-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: WorkTimeRecorder APK
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            ## WorkTimeRecorder — debug APK

            ### Instalacja
            1. Pobierz plik `app-debug.apk`
            2. Na telefonie włącz: Ustawienia → Bezpieczeństwo → Nieznane źródła
            3. Zainstaluj APK

            ### Funkcje
            - Widżet 1×1 (tap = start/stop)
            - Odliczanie czasu do końca pracy
            - Widok tygodniowy
            - Ustawienia celu (domyślnie 8h 30min)
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
